{% extends "base.html" %}

{% block title %}পাসওয়ার্ড রিসেট - Hello Naogaon{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card shadow-sm">
                <div class="card-body p-5">
                    <h2 class="card-title text-center fw-bold mb-4">পাসওয়ার্ড রিসেট</h2>
                    <p class="text-center text-muted mb-4">আপনার পাসওয়ার্ড রিসেট করার জন্য আপনার ইমেইল ঠিকানা দিন।</p>
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="id_email" class="form-label">ইমেইল ঠিকানা</label>
                            <input type="email" name="email" class="form-control" id="id_email" required>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-success btn-lg fw-bold">রিসেট লিংক পাঠান</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
