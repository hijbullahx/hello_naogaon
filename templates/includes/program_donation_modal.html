<!-- Program Financial Contribution Modal -->
<div class="modal fade" id="programDonationModal" tabindex="-1" aria-labelledby="programDonationModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg rounded-4 overflow-hidden">
            <div class="modal-header bg-success text-white py-3 px-4">
                <div>
                    <h5 class="modal-title fw-bold text-white mb-0" id="programDonationModalLabel">
                        <i class="fas fa-hand-holding-heart me-2"></i>আর্থিক সহায়তা প্রদান
                    </h5>
                    <small class="text-white-50" id="modal_program_title_display">কার্যক্রমের নাম</small>
                </div>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form action="{% url 'donations:initiate_payment' %}" method="POST" id="programGlobalDonateForm">
                {% csrf_token %}
                <input type="hidden" name="program_id" id="modal_program_id" value="">
                
                <div class="modal-body p-4">
                    <!-- Progress Info (Shown if target amount is present) -->
                    <div id="modal_program_progress_box" class="alert alert-success-subtle border border-success p-3 rounded-3 mb-3 d-none">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <span class="small text-secondary fw-semibold">লক্ষ্যমাত্রা: <strong id="modal_target_amount_display">৳০</strong></span>
                            <span class="small fw-bold text-success" id="modal_raised_amount_display">সংগৃহীত: ৳০</span>
                        </div>
                        <div class="progress" style="height: 6px;">
                            <div class="progress-bar bg-success" id="modal_progress_bar" style="width: 0%;"></div>
                        </div>
                    </div>

                    <!-- Donor Identity Type Selection -->
                    <div class="mb-3">
                        <label class="form-label fw-bold small text-secondary">আপনি কীভাবে অনুদান দিতে চান? <span class="text-danger">*</span></label>
                        <div class="d-flex gap-3">
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="donor_identity_type" id="global_identity_gen" value="general" checked onchange="toggleProgGlobalDonorType('general')">
                                <label class="form-check-label fw-bold text-dark" for="global_identity_gen">
                                    সাধারণ শুভাকাঙ্ক্ষী
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="donor_identity_type" id="global_identity_mem" value="member" onchange="toggleProgGlobalDonorType('member')">
                                <label class="form-check-label fw-bold text-success" for="global_identity_mem">
                                    সংস্থার সদস্য (Member)
                                </label>
                            </div>
                        </div>
                    </div>

                    <!-- Member ID Field (Hidden by default) -->
                    <div id="progGlobalMemberField" class="mb-3 d-none">
                        <label class="form-label fw-bold text-dark small">সদস্য আইডি (Member ID) <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-success fw-bold"><i class="fas fa-id-badge"></i></span>
                            <input type="text" class="form-control fw-bold" name="membership_id" id="progGlobalMemberId" placeholder="যেমন: 26082301" oninput="lookupProgGlobalMember(this.value)">
                            <button class="btn btn-success fw-bold" type="button" onclick="lookupProgGlobalMember(document.getElementById('progGlobalMemberId').value)">যাচাই</button>
                        </div>
                        <div id="progGlobalMemberFeedback" class="form-text small mt-1 text-muted">আইডি দিলে নাম ও মোবাইল স্বয়ংক্রিয়ভাবে লোড হবে।</div>
                    </div>

                    <!-- Donor Name & Phone Fields -->
                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <label class="form-label fw-bold small">আপনার নাম <span class="text-danger">*</span></label>
                            <input type="text" name="donor_name" id="progGlobalDonorName" class="form-control" placeholder="আপনার পূর্ণ নাম" required>
                        </div>
                        <div class="col-6">
                            <label class="form-label fw-bold small">মোবাইল নম্বর <span class="text-danger">*</span></label>
                            <input type="tel" name="donor_phone" id="progGlobalDonorPhone" class="form-control" placeholder="০১XXXXXXXXX" required>
                        </div>
                    </div>

                    <!-- Amount Selection -->
                    <div class="mb-3">
                        <label class="form-label fw-bold text-dark small mb-1">আর্থিক সহায়তার পরিমাণ (BDT / ৳) <span class="text-danger">*</span></label>
                        <div class="d-flex flex-wrap gap-1 mb-2">
                            <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill modal-global-pill" onclick="setProgGlobalAmount(100)">৳১০০</button>
                            <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill modal-global-pill" onclick="setProgGlobalAmount(250)">৳২৫০</button>
                            <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill modal-global-pill active" onclick="setProgGlobalAmount(500)">৳৫০০</button>
                            <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill modal-global-pill" onclick="setProgGlobalAmount(1000)">৳১,০০০</button>
                            <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill modal-global-pill" onclick="setProgGlobalAmount(2000)">৳২,০০০</button>
                            <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill modal-global-pill" onclick="setProgGlobalAmount(5000)">৳৫,০০০</button>
                        </div>
                        <div class="input-group input-group-lg">
                            <span class="input-group-text bg-light fw-bold text-success">৳ BDT</span>
                            <input type="number" name="amount" id="progGlobalAmount" value="500" min="10" step="any" required class="form-control fw-bold fs-4 text-success" placeholder="টাকার পরিমাণ লিখুন">
                        </div>
                    </div>

                    <!-- Notes -->
                    <div class="mb-2">
                        <label class="form-label small text-secondary">মন্তব্য বা শুভকামনা (ঐচ্ছিক)</label>
                        <input type="text" name="note" class="form-control form-control-sm" placeholder="প্রোগ্রামের জন্য আপনার কোনো বিশেষ বার্তা থাকলে লিখুন">
                    </div>
                </div>
                <div class="modal-footer bg-light py-2 px-4 d-flex justify-content-between">
                    <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill px-3" data-bs-dismiss="modal">বাতিল</button>
                    <button type="submit" class="btn btn-success fw-bold rounded-pill px-4 shadow-sm">
                        <i class="fas fa-lock me-1"></i>পেমেন্টে এগিয়ে যান &rarr;
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
function toggleProgGlobalDonorType(type) {
    var memField = document.getElementById('progGlobalMemberField');
    var memInput = document.getElementById('progGlobalMemberId');
    if (type === 'member') {
        if (memField) memField.classList.remove('d-none');
        if (memInput) memInput.setAttribute('required', 'required');
    } else {
        if (memField) memField.classList.add('d-none');
        if (memInput) {
            memInput.removeAttribute('required');
            memInput.value = '';
        }
        var feedback = document.getElementById('progGlobalMemberFeedback');
        if (feedback) feedback.innerHTML = 'আইডি দিলে নাম ও মোবাইল স্বয়ংক্রিয়ভাবে লোড হবে।';
    }
}

function lookupProgGlobalMember(val) {
    val = (val || '').trim();
    var feedback = document.getElementById('progGlobalMemberFeedback');
    if (!val) {
        if (feedback) feedback.innerHTML = 'আইডি দিলে নাম ও মোবাইল স্বয়ংক্রিয়ভাবে লোড হবে।';
        return;
    }
    fetch('/donations/api/member-pledge/?member_id=' + encodeURIComponent(val))
        .then(function(r) { return r.json(); })
        .then(function(data) {
            if (data.found) {
                if (feedback) feedback.innerHTML = '<span class="text-success fw-bold"><i class="fas fa-check-circle me-1"></i>' + data.full_name + ' (' + data.phone + ')</span>';
                var nameInput = document.getElementById('progGlobalDonorName');
                var phoneInput = document.getElementById('progGlobalDonorPhone');
                if (nameInput) nameInput.value = data.full_name;
                if (phoneInput) phoneInput.value = data.phone;
            } else {
                if (feedback) feedback.innerHTML = '<span class="text-danger"><i class="fas fa-exclamation-circle me-1"></i>সদস্য আইডি পাওয়া যায়নি</span>';
            }
        })
        .catch(function(e) { console.error(e); });
}

function setProgGlobalAmount(val) {
    var elem = document.getElementById('progGlobalAmount');
    if (elem) elem.value = val;
    document.querySelectorAll('.modal-global-pill').forEach(function(btn) {
        btn.classList.remove('active');
        if (btn.innerText.includes(val.toString())) {
            btn.classList.add('active');
        }
    });
}

document.addEventListener('DOMContentLoaded', function() {
    var modalElem = document.getElementById('programDonationModal');
    if (modalElem) {
        modalElem.addEventListener('show.bs.modal', function(event) {
            var button = event.relatedTarget;
            if (button) {
                var pId = button.getAttribute('data-program-id') || '';
                var pTitle = button.getAttribute('data-program-title') || 'সাধারণ কার্যক্রম';
                var targetAmt = parseFloat(button.getAttribute('data-target-amount')) || 0;
                var raisedAmt = parseFloat(button.getAttribute('data-raised-amount')) || 0;
                var progressPct = parseInt(button.getAttribute('data-progress-percent')) || 0;
                
                var inputId = document.getElementById('modal_program_id');
                var inputTitle = document.getElementById('modal_program_title_display');
                var progressBox = document.getElementById('modal_program_progress_box');
                
                if (inputId) inputId.value = pId;
                if (inputTitle) inputTitle.textContent = pTitle;

                if (targetAmt > 0 && progressBox) {
                    progressBox.classList.remove('d-none');
                    document.getElementById('modal_target_amount_display').innerText = '৳' + targetAmt.toLocaleString('en-US');
                    document.getElementById('modal_raised_amount_display').innerText = 'সংগৃহীত: ৳' + raisedAmt.toLocaleString('en-US') + ' (' + progressPct + '%)';
                    document.getElementById('modal_progress_bar').style.width = progressPct + '%';
                } else if (progressBox) {
                    progressBox.classList.add('d-none');
                }
            }
        });
    }
});
</script>
